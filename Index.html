<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Pro Copilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-10 shadow-lg flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-file-excel text-green-500 text-2xl"></i>
            <h1 class="font-bold text-xl tracking-wide">Excel Master AI</h1>
        </div>
        <button onclick="toggleSettings()" class="text-slate-400 hover:text-white transition">
            <i class="fa-solid fa-gear text-xl"></i>
        </button>
    </header>

    <!-- API Key Modal / Settings -->
    <div id="settings-modal" class="bg-slate-800 p-4 border-b border-slate-700 hidden">
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">आपकी Gemini API Key:</label>
        <div class="flex gap-2">
            <input type="password" id="api-key" placeholder="AI Studio से ली हुई API Key यहाँ डालें..." class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-green-500">
            <button onclick="saveApiKey()" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded text-sm font-bold transition">Save</button>
        </div>
    </div>

    <!-- Chat Container -->
    <main id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 max-w-3xl mx-auto w-full">
        <!-- Default Welcome Message -->
        <div class="bg-slate-800/60 border border-slate-700 p-4 rounded-xl flex gap-3">
            <i class="fa-solid fa-robot text-green-400 text-xl mt-1"></i>
            <div>
                <p class="font-bold text-green-400">Excel Boss Ready!</p>
                <p class="text-sm text-slate-300 mt-1">बॉस या कलीग ने Excel में क्या काम दिया है? हिंदी या हिंग्लिश में बताओ, मैं तुम्हें 1-2-3 करके बच्चों वाले एकदम आसान स्टेप्स बताऊंगा!</p>
            </div>
        </div>
    </main>

    <!-- Input Box -->
    <footer class="p-4 bg-slate-800 border-t border-slate-700 sticky bottom-0">
        <div class="max-w-3xl mx-auto flex gap-2">
            <input type="text" id="user-input" placeholder="जैसे: Pivot table से हर डाटा की अलग शीट कैसे बनाऊँ?" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-green-500" onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-green-600 hover:bg-green-500 text-white px-5 py-3 rounded-xl font-bold transition flex items-center gap-2">
                <span>पूछो</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </footer>

    <script>
        // LocalStorage से API Key लोड करना
        document.getElementById('api-key').value = localStorage.getItem('GEMINI_API_KEY') || '';

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('api-key').value.trim();
            localStorage.setItem('GEMINI_API_KEY', key);
            alert('API Key सेव हो गई!');
            toggleSettings();
        }

        // AI का "सुपर-स्मार्ट + सिंपल" सिस्टम इंस्ट्रक्शन
        const SYSTEM_PROMPT = `तुम एक दुनिया के सबसे एडवांस्ड Excel एक्सपर्ट हो। तुम्हारा यूजर कंप्यूटर पर दूसरों के सामने काम कर रहा है और उसे कठिन थ्योरी नहीं चाहिए।
नियम:
1. यूजर चाहे कितना भी मुश्किल टास्क पूछे (VBA, Power Query, Pivot, Formulas, Nested IF, XLOOKUP), तुम्हें उसे एकदम सरल हिंदी/हिंग्लिश में 5 साल के बच्चे की तरह समझाना है।
2. उत्तर हमेशा Step 1, Step 2, Step 3 के रूप में हो।
3. स्पष्ट बताओ कि माउस कहाँ ले जाना है, कौन-सा बटन दबाना है या कीबोर्ड शॉर्टकट क्या है।
4. कोई फालतू का ज्ञान मत दो, सीधे पॉइंट पर आओ ताकि यूजर तुरंत कंप्यूटर पर क्लिक कर सके।`;

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const query = input.value.trim();
            const apiKey = localStorage.getItem('GEMINI_API_KEY');

            if (!query) return;
            if (!apiKey) {
                alert('कृपया पहले सेटिंग्स (⚙️) आइकन पर क्लिक करके अपनी Gemini API Key डालें!');
                toggleSettings();
                return;
            }

            const chatBox = document.getElementById('chat-box');

            // User Chat Bubble
            chatBox.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-green-600 text-white p-3 rounded-xl max-w-[85%] text-sm shadow">
                        ${query}
                    </div>
                </div>
            `;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Loading Indicator
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div id="${loadingId}" class="flex gap-3">
                    <i class="fa-solid fa-robot text-green-400 text-xl"></i>
                    <div class="bg-slate-800 border border-slate-700 p-3 rounded-xl text-slate-400 text-sm animate-pulse">
                        सोच रहा हूँ... रूको तुरंत स्टेप्स बताता हूँ...
                    </div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Gemini 1.5 Flash API Call
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: SYSTEM_PROMPT },
                                { text: "यूजर का सवाल: " + query }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let reply = data.candidates[0].content.parts[0].text;
                    // Format response for readability
                    reply = reply.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');

                    chatBox.innerHTML += `
                        <div class="flex gap-3">
                            <i class="fa-solid fa-robot text-green-400 text-xl mt-1"></i>
                            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl text-slate-200 text-sm leading-relaxed shadow space-y-2">
                                ${reply}
                            </div>
                        </div>
                    `;
                } else {
                    throw new Error("Invalid Response");
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `
                    <div class="text-red-400 text-xs text-center p-2">
                        एरर आ गया! कृपया अपनी API Key जांचें या दोबारा कोशिश करें।
                    </div>
                `;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
