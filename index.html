<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Assistant Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header (Light Theme) -->
    <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-10 shadow-sm flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="bg-emerald-100 p-2 rounded-lg">
                <i class="fa-solid fa-file-excel text-emerald-600 text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-800 text-lg leading-none">Excel AI Assistant</h1>
                <span class="text-xs text-slate-500">Fast & Simple Step-by-Step Guide</span>
            </div>
        </div>
        <button onclick="toggleSettings()" class="text-slate-500 hover:text-slate-800 p-2 rounded-lg hover:bg-slate-100 transition">
            <i class="fa-solid fa-gear text-lg"></i>
        </button>
    </header>

    <!-- API Key Settings Box -->
    <div id="settings-modal" class="bg-emerald-50 border-b border-emerald-200 p-4 hidden">
        <div class="max-w-3xl mx-auto">
            <label class="block text-xs font-bold text-emerald-900 uppercase mb-1">Google Gemini API Key:</label>
            <div class="flex gap-2">
                <input type="password" id="api-key" placeholder="AI Studio से ली हुई API Key यहाँ पेस्ट करें..." class="flex-1 bg-white border border-emerald-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-800">
                <button onclick="saveApiKey()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg text-sm font-semibold transition">Save</button>
            </div>
        </div>
    </div>

    <!-- Chat Area -->
    <main id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 max-w-3xl mx-auto w-full">
        <!-- Default Welcome Bubble -->
        <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm flex gap-3">
            <div class="bg-slate-100 h-8 w-8 rounded-full flex items-center justify-center shrink-0">
                <i class="fa-solid fa-robot text-emerald-600"></i>
            </div>
            <div>
                <p class="font-bold text-slate-800 text-sm">नमस्ते! मैं आपका Excel Expert हूँ।</p>
                <p class="text-xs text-slate-600 mt-1">कंप्यूटर पर क्या काम करना है? बस मुझे बताओ, मैं तुम्हें Step-1, Step-2 करके एकदम आसान भाषा में बटन दबाना सिखा दूंगा!</p>
            </div>
        </div>
    </main>

    <!-- Footer Input Bar -->
    <footer class="p-4 bg-white border-t border-slate-200 sticky bottom-0">
        <div class="max-w-3xl mx-auto flex gap-2">
            <input type="text" id="user-input" placeholder="जैसे: Pivot table कैसे बनाते हैं?" class="flex-1 bg-slate-100 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-800 placeholder-slate-400" onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 rounded-xl font-semibold transition flex items-center gap-2 text-sm shadow-sm">
                <span>पूछो</span>
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </div>
    </footer>

    <script>
        // LocalStorage से API Key लोड करना
        document.getElementById('api-key').value = localStorage.getItem('GEMINI_API_KEY') || '';

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('api-key').value.trim();
            localStorage.setItem('GEMINI_API_KEY', key);
            alert('API Key सुरक्षित सेव हो गई है!');
            toggleSettings();
        }

        const SYSTEM_PROMPT = `तुम एक दुनिया के सबसे एडवांस्ड Excel एक्सपर्ट हो। तुम्हारा यूजर कंप्यूटर पर दूसरों के सामने काम कर रहा है और उसे कठिन थ्योरी नहीं चाहिए।
नियम:
1. यूजर चाहे कितना भी मुश्किल टास्क पूछे (VBA, Power Query, Pivot, Formulas, Nested IF, XLOOKUP), तुम्हें उसे एकदम सरल हिंदी/हिंग्लिश में 5 साल के बच्चे की तरह समझाना है।
2. उत्तर हमेशा Step 1, Step 2, Step 3 के रूप में हो।
3. स्पष्ट बताओ कि माउस कहाँ ले जाना है, कौन-सा बटन दबाना है या कीबोर्ड शॉर्टकट क्या है।
4. कोई फालतू ज्ञान मत दो, सीधे पॉइंट पर आओ ताकि यूजर तुरंत कंप्यूटर पर क्लिक कर सके।`;

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const query = input.value.trim();
            const apiKey = localStorage.getItem('GEMINI_API_KEY');

            if (!query) return;
            if (!apiKey) {
                alert('कृपया पहले सेटिंग्स (⚙️) आइकन पर क्लिक करके अपनी Gemini API Key डालें!');
                toggleSettings();
                return;
            }

            const chatBox = document.getElementById('chat-box');

            // User Message Bubble
            chatBox.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-emerald-600 text-white p-3 rounded-2xl rounded-tr-none max-w-[85%] text-sm shadow-sm">
                        ${query}
                    </div>
                </div>
            `;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Loading State
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div id="${loadingId}" class="flex gap-3">
                    <div class="bg-slate-100 h-8 w-8 rounded-full flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-robot text-emerald-600"></i>
                    </div>
                    <div class="bg-white border border-slate-200 p-3 rounded-2xl rounded-tl-none text-slate-400 text-xs shadow-sm animate-pulse flex items-center gap-2">
                        <span>सोच रहा हूँ, तुरंत आसान स्टेप्स बताता हूँ...</span>
                    </div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Updated API call to Gemini 2.5 Flash
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: SYSTEM_PROMPT },
                                { text: "यूजर का सवाल: " + query }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                // Agar API ne error status diya (invalid key, quota, model access, etc.)
                if (!response.ok) {
                    throw new Error(data.error?.message || `HTTP ${response.status} - कोई जवाब नहीं मिला`);
                }

                // Agar safety filter ya kisी aur wajah se content block hua
                const candidate = data.candidates && data.candidates[0];
                const replyText = candidate && candidate.content && candidate.content.parts && candidate.content.parts[0] && candidate.content.parts[0].text;

                if (replyText) {
                    let reply = replyText;
                    // Format response text
                    reply = reply.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');

                    chatBox.innerHTML += `
                        <div class="flex gap-3">
                            <div class="bg-slate-100 h-8 w-8 rounded-full flex items-center justify-center shrink-0 mt-1">
                                <i class="fa-solid fa-robot text-emerald-600"></i>
                            </div>
                            <div class="bg-white border border-slate-200 p-4 rounded-2xl rounded-tl-none text-slate-700 text-sm leading-relaxed shadow-sm space-y-2">
                                ${reply}
                            </div>
                        </div>
                    `;
                } else {
                    const blockReason = candidate?.finishReason || data.promptFeedback?.blockReason;
                    throw new Error(blockReason ? `जवाब ब्लॉक हुआ: ${blockReason}` : 'खाली जवाब मिला');
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `
                    <div class="bg-red-50 border border-red-200 text-red-600 text-xs text-center p-3 rounded-xl">
                        एरर: ${err.message}
                    </div>
                `;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
